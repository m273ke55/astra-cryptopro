---
- name: Install and configure CryptoPro CSP on localhost
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Укажите путь к архиву, полученному самостоятельно с сайта CryptoPro.
    cryptopro_csp_archive_path: "/path/to/linux-amd64_deb.tgz"

  roles:
    - role: astra.cryptopro.cryptopro_csp
